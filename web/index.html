<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Chocolate Doom · Freedoom</title>
<style>
:root{color-scheme:dark;--line:#333;--muted:#aaa;--fg:#eee}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;color:var(--fg);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}body{overflow:hidden}.frame{width:100%;height:100dvh;display:flex;flex-direction:column;margin:0 auto;border:1px solid var(--line)}.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;color:var(--muted);background:#101010}.bar{border-bottom:1px solid var(--line)}.controls{border-top:1px solid var(--line);justify-content:center;flex-wrap:wrap}.screen{position:relative;flex:1;min-height:0;background:#000}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none}.loading{position:absolute;inset:0;display:grid;place-content:center;gap:8px;background:#000;color:var(--muted);text-align:center}.loading[hidden]{display:none}.loading h1{margin:0;color:var(--fg);font-size:14px;font-weight:600}.status{color:#a9d6a9}@media(min-width:900px){.frame{max-width:1280px;height:100dvh}}
</style>
</head>
<body>
<main class="frame" aria-label="Chocolate Doom">
  <header class="bar"><span>FREEDOOM · PHASE 1</span><span class="status" id="wasm-status">CARREGANDO JOGO…</span></header>
  <section class="screen"><canvas id="canvas" width="640" height="400" aria-label="Jogo Doom"></canvas><div class="loading" id="loading"><h1>Carregando Doom…</h1><span>O jogo iniciará automaticamente.</span></div></section>
  <footer class="controls"><span>↑/↓ mover</span><span>←/→ virar</span><span>Ctrl disparar</span><span>Espaço usar</span></footer>
</main>
<script src="/game.js"></script>
<script src="/doom/chocolate-doom.js"></script>
</body>
</html>
